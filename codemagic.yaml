workflows:
  ios-app-store:
    name: videoedit - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.ksanew.videoedit
        APP_NAME: videoedit
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: Validate App Store Connect credentials
        script: |
          set -e
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Add it to appstore_credentials}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Add it to appstore_credentials}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Add it to appstore_credentials}"
          : "${IOS_ADMOB_APP_ID:?Add the production iOS AdMob App ID to appstore_credentials}"

      - name: Configure production iOS values
        script: |
          /usr/libexec/PlistBuddy -c \
            "Set :GADApplicationIdentifier $IOS_ADMOB_APP_ID" \
            ios/Runner/Info.plist

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          rm -rf Pods
          pod install --repo-update

      - name: Verify Swift module settings
        script: |
          SETTINGS=$(xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildSettings)
          echo "$SETTINGS" | grep "BUILD_LIBRARY_FOR_DISTRIBUTION = NO"
          if echo "$SETTINGS" | grep -q "BUILD_LIBRARY_FOR_DISTRIBUTION = YES"; then
            echo "Library evolution must remain disabled for Flutter bridging headers."
            exit 1
          fi

      - name: Analyze project
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Fetch Apple signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Resolve App Store build number
        script: |
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
            BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
            BUILD_NUMBER="$CM_BUILD_NUMBER"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

